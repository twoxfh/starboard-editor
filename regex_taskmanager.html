<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Regex Note Taker</title>
    <style>
         body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background: #f8f9fa;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .search-container, .header-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .header-buttons {
            justify-content: flex-end;
        }

        .container {
            display: flex;
            gap: 10px;
        }

.sidebar {
    width: 250px; /* Fixed width for the sidebar */
    background: white;
    padding: 10px;
    border: 1px solid #ddd;
    flex-shrink: 0; /* Prevent sidebar from shrinking */
}

.sidebar .checkbox-container {
    display: grid;
    grid-template-columns: auto 1fr; /* Two columns: one for checkbox, one for label */
    align-items: center;
    gap: 8px;
    text-align: left; /* Ensure text is aligned to the left */
}

.sidebar .checkbox-container input[type="checkbox"] {
    margin-right: 8px; /* Add some space between checkbox and label */
}

.sidebar .checkbox-container label {
    margin: 0; /* Remove default margin */
}

        .main-content {
            flex-grow: 1; /* Allow main-content to take up remaining space */
        }

        .note-item {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px 0;
            background: white;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .note-dates {
            color: #666;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            background: white;
            margin: 15% auto;
            padding: 20px;
            width: 80%;
            position: relative;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
        }

        input, textarea, button {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .remove-filter-btn {
            background: #dc3545;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 5px;
        }

        .remove-filter-btn:hover {
            background: #c82333;
        }

        #notePreview {
            border: 1px solid #ccc;
            padding: 10px;
            background: #fff;
            overflow-y: auto;
            font-family: inherit;
            line-height: 1.5;
        }

        .textarea-lined {
            background-image: linear-gradient(
                to bottom,
                #ddd 0.1em,
                transparent 0.1em
            );
            background-size: 100% 1.5em;
            background-repeat: repeat-y;
            background-position: top left;
            background-clip: content-box;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            line-height: 1.5em;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
            resize: vertical;
            box-sizing: border-box;
            margin-top: 0.5em;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <div class="search-container">
            <input type="text" id="keywordFilter" oninput="renderAll()" placeholder="Search notes...">
            <!--button onclick="clearSearch()">Clear Search</button-->
        
        <div class="header-buttons">
            <button onclick="showAddNoteModal()">Add Note</button>
            <button onclick="showAddRegexModal()">Add Filter</button>
            <button onclick="exportNotes()">Export</button>
            <button onclick="importNotes()">Import</button>
        </div>
        </div>
    </header>

    <div class="container">
        <div class="sidebar"></div>
        <div class="main-content">
            <ul id="noteList"></ul>
        </div>
    </div>

    <div id="noteModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Note</h2>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <textarea id="noteContent" placeholder="Write your note in Markdown..." class="textarea-lined"></textarea>
                <div id="notePreview"></div>
            </div>
            <input type="hidden" id="noteId">
            <button onclick="saveNote()">Save</button>
        </div>
    </div>

    <div id="regexModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Filter</h2>
            <input type="text" id="regexInput" placeholder="Enter regex pattern (e.g., /#\w+/g)">
            <button onclick="saveRegex()">Save</button>
        </div>
    </div>

    <script>
    let notes = [];
    let regexes = [];
    let selectedMatches = [];
    const noteModal = document.getElementById('noteModal');
    const regexModal = document.getElementById('regexModal');

    document.addEventListener('DOMContentLoaded', () => {
        notes = JSON.parse(localStorage.getItem('notes')) || [];
        regexes = JSON.parse(localStorage.getItem('regexes')) || [];
        selectedMatches = [];
        renderAll();
    });

    function appendMatchedText(regex, text) {
        const pattern = regex.toString().slice(1, -1);
        const match = text.match(regex);
        return match ? match[0] : pattern.replace('\\w+', text);
    }

    function renderAll() {
        const filteredNotes = getFilteredNotes();
        renderNoteList(filteredNotes);
        renderRegexFilters(filteredNotes);
    }

    function getFilteredNotes() {
        let filtered = [...notes];

        const keywords = document.getElementById('keywordFilter').value.trim().toLowerCase().split(/\s+/).filter(k => k);
        if (keywords.length) {
            filtered = filtered.filter(note =>
                keywords.every(k => note.content.toLowerCase().includes(k))
            );
        }

        if (selectedMatches.length) {
            filtered = filtered.filter(note =>
                selectedMatches.every(match =>
                    testRegexMatch(note, match.regexPattern, match.matchValue)
                )
            );
        }

        return filtered;
    }

    function testRegexMatch(note, regexStr, matchValue) {
        try {
            const regex = parseRegex(regexStr);
            return (note.content.match(regex) || []).includes(matchValue);
        } catch {
            return false;
        }
    }

    function parseRegex(regexStr) {
        const matches = regexStr.match(/\/(.*)\/([a-z]*)/i);
        if (!matches) throw new Error('Invalid regex');
        return new RegExp(matches[1], matches[2]);
    }

    function renderNoteList(notesList) {
        const noteList = document.getElementById('noteList');
        noteList.innerHTML = '';

        notesList.forEach(note => {
            const item = document.createElement('li');
            item.className = 'note-item';

            const contentDiv = document.createElement('div');
            contentDiv.innerHTML = marked.parse(note.content);

            const datesDiv = document.createElement('div');
            datesDiv.className = 'note-dates';
            datesDiv.textContent = `Created: ${note.created.toLocaleString()} | Updated: ${note.updated.toLocaleString()}`;

            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'note-buttons';
            buttonsDiv.style.display = 'flex';
            buttonsDiv.style.gap = '5px';

            const editBtn = document.createElement('button');
            editBtn.textContent = 'Edit';
            editBtn.onclick = () => showEditNoteModal(note);

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.onclick = () => deleteNote(note.id);

            buttonsDiv.append(editBtn, deleteBtn);

            item.append(contentDiv, datesDiv, buttonsDiv);
            noteList.appendChild(item);
        });
    }

    function renderRegexFilters(filteredNotes) {
        const sidebar = document.querySelector('.sidebar');
        sidebar.innerHTML = '';

        regexes.forEach(regexStr => {
            const section = document.createElement('div');
            section.className = 'regex-section';

            const headerDiv = document.createElement('div');
            headerDiv.style.display = 'flex';
            headerDiv.style.alignItems = 'center';

            const headerText = document.createElement('h4');
            headerText.textContent = `Filter: ${regexStr}`;

            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-filter-btn';
            removeBtn.textContent = 'X';
            removeBtn.onclick = () => removeRegex(regexStr);

            headerDiv.append(headerText, removeBtn);

            const ul = document.createElement('ul');

            const regex = parseRegex(regexStr);
            const allMatches = [];

            filteredNotes.forEach(note => {
                const matches = note.content.match(regex) || [];
                allMatches.push(...matches);
            });

            const uniqueMatches = Array.from(new Set(allMatches));
            const counts = uniqueMatches.reduce((acc, m) => {
                acc[m] = (allMatches.filter(x => x === m).length);
                return acc;
            }, {});

            uniqueMatches.forEach(match => {
                const li = document.createElement('li');
                li.className = 'checkbox-container';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.dataset.regex = regexStr;
                checkbox.dataset.match = match;
                checkbox.checked = isMatchSelected(regexStr, match);

                const label = document.createElement('label');
                label.textContent = `${match} (${counts[match]})`;

                checkbox.addEventListener('click', toggleMatchSelection);

                li.append(checkbox, label);
                ul.appendChild(li);
            });

            section.append(headerDiv, ul);
            sidebar.appendChild(section);
        });
    }

    function isMatchSelected(regexStr, matchValue) {
        return selectedMatches.some(m =>
            m.regexPattern === regexStr && m.matchValue === matchValue
        );
    }

    function toggleMatchSelection(e) {
        const checkbox = e.target;
        const regexStr = checkbox.dataset.regex;
        const matchValue = checkbox.dataset.match;

        if (checkbox.checked) {
            selectedMatches.push({ regexPattern: regexStr, matchValue });
        } else {
            selectedMatches = selectedMatches.filter(m =>
                !(m.regexPattern === regexStr && m.matchValue === matchValue)
            );
        }

        renderAll();
    }

    function removeRegex(regexStr) {
    	if (confirm('Are you sure you want to delete this filter?')) {
        	regexes = regexes.filter(r => r !== regexStr);
        	selectedMatches = selectedMatches.filter(m => m.regexPattern !== regexStr);
        	saveRegexes();
        	renderAll();
    	}
	}	

    function saveNote() {
        const content = document.getElementById('noteContent').value.trim();
        const noteId = document.getElementById('noteId').value;
        const now = new Date();

        if (!content) return;

        const newNote = {
            id: noteId || Date.now().toString(),
            content,
            created: noteId ? notes.find(n => n.id === noteId).created : now,
            updated: now
        };

        if (noteId) {
            notes = notes.map(n => n.id === noteId ? newNote : n);
        } else {
            notes.push(newNote);
        }

        saveNotes();
        closeModals();
        renderAll();
    }

    function deleteNote(id) {
        if (confirm('Are you sure?')) {
            notes = notes.filter(n => n.id !== id);
            saveNotes();
            renderAll();
        }
    }

    function saveNotes() {
        localStorage.setItem('notes', JSON.stringify(notes));
    }

    function showAddNoteModal() {
        noteModal.style.display = 'block';
        document.getElementById('modalTitle').textContent = 'Add Note';
        document.getElementById('noteId').value = '';
        document.getElementById('noteContent').value = '';
        document.getElementById('notePreview').innerHTML = '';

        if (selectedMatches.length > 0) {
            let generatedContent = '';
            selectedMatches.forEach(({ regexPattern, matchValue }) => {
                try {
                    const regex = parseRegex(regexPattern);
                    const replacement = appendMatchedText(regex, matchValue);
                    generatedContent += `${replacement} `;
                } catch (e) {
                    console.error('Invalid regex:', regexPattern);
                }
            });
            document.getElementById('noteContent').value = generatedContent.trim();
        }

        document.getElementById('noteContent').addEventListener('input', updatePreview);
        document.getElementById('noteContent').addEventListener('keydown', handleListKeys);
        updatePreview();
    }

    function showEditNoteModal(note) {
        noteModal.style.display = 'block';
        document.getElementById('modalTitle').textContent = 'Edit Note';
        document.getElementById('noteContent').value = note.content;
        document.getElementById('noteId').value = note.id;
        document.getElementById('notePreview').innerHTML = '';

        document.getElementById('noteContent').addEventListener('input', updatePreview);
        document.getElementById('noteContent').addEventListener('keydown', handleListKeys);
        updatePreview();
    }

    function showAddRegexModal() {
        regexModal.style.display = 'block';
        document.getElementById('regexInput').value = '';
    }

    function saveRegex() {
        const regexStr = document.getElementById('regexInput').value.trim();

        if (!regexStr) return;

        try {
            parseRegex(regexStr);
            regexes.push(regexStr);
            saveRegexes();
            closeModals();
            renderAll();
        } catch (e) {
            alert('Invalid regex format. Example: /pattern/flags');
        }
    }

    function saveRegexes() {
        localStorage.setItem('regexes', JSON.stringify(regexes));
    }

    function closeModals() {
        noteModal.style.display = 'none';
        regexModal.style.display = 'none';
    }

    document.querySelectorAll('.modal .close').forEach(btn => {
        btn.onclick = closeModals;
    });

    window.onclick = (e) => {
        const modals = [noteModal, regexModal];
        modals.forEach(modal => {
            if (e.target === modal) modal.style.display = 'none';
        });
    };

    function exportNotes() {
        const data = {
            notes: notes,
            regexes: regexes
        };
        const json = JSON.stringify(data);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'notes_backup.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function importNotes() {
        const input = document.createElement('input');
        input.type = 'file';

        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    notes = data.notes || [];
                    regexes = data.regexes || [];
                    saveNotes();
                    saveRegexes();
                    renderAll();
                } catch {
                    alert('Invalid file format');
                }
            };
            reader.readAsText(file);
        };

        input.click();
    }

    function clearSearch() {
        document.getElementById('keywordFilter').value = '';
        renderAll();
    }

    function updatePreview() {
        const content = document.getElementById('noteContent').value;
        const preview = document.getElementById('notePreview');
        preview.innerHTML = marked.parse(content);
    }

    function handleListKeys(e) {
        const textarea = e.target;
        const startPos = textarea.selectionStart;
        const endPos = textarea.selectionEnd;
        const selectedText = textarea.value.substring(startPos, endPos);
        const lines = textarea.value.split('\n');
        const isEnter = e.key === 'Enter';
        const isTab = e.key === 'Tab';
        const isShiftTab = e.shiftKey && e.key === 'Tab';

        if (isEnter) {
            e.preventDefault();
            const before = textarea.value.substring(0, startPos);
            const after = textarea.value.substring(endPos);
            let newLine = '\n';

            const currentLineStart = before.lastIndexOf('\n', startPos) + 1;
            const currentLineEnd = before.indexOf('\n', currentLineStart);
            const currentLine = before.substring(currentLineStart, currentLineEnd !== -1 ? currentLineEnd : before.length);

            const indent = currentLine.match(/^\s*/)[0];

            newLine += indent;

            textarea.value = before + newLine + after;

            textarea.selectionStart = textarea.selectionEnd = startPos + newLine.length;
            return;
        }

        if (isTab || isShiftTab) {
            e.preventDefault();
            const value = textarea.value;

            const startLine = value.slice(0, startPos).split('\n').length - 1;
            const endLine = value.slice(0, endPos).split('\n').length - 1;
            let newValue = value.split('\n');

            for (let i = startLine; i <= endLine; i++) {
                const line = newValue[i];
                newValue[i] = '  ' + line;
            }

            const newValueStr = newValue.join('\n');
            const newStart = startPos + (isTab ? 2 : -2);
            const newEnd = endPos + (isTab ? 2 : -2);

            textarea.value = newValueStr;
            textarea.selectionStart = Math.max(0, newStart);
            textarea.selectionEnd = Math.max(0, newEnd);
        }
    }
    </script>
</body>
</html>
